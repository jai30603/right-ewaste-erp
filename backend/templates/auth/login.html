<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Right Ewaste ERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/shared.css') }}" rel="stylesheet">
</head>
<body class="bg-light">
    <main class="container d-flex min-vh-100 align-items-center justify-content-center py-4">
        <section class="card shadow-sm" style="width: 100%; max-width: 400px; border-radius: 8px;">
            <div class="card-body p-4">
                <h1 class="h4 mb-1">Right Ewaste ERP</h1>
                <p class="text-muted mb-4">Sign in to continue.</p>
                {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category }}" role="alert">{{ message }}</div>
                {% endfor %}
                {% endwith %}
                <form method="POST" novalidate>
                    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
                    <input type="hidden" name="next" value="{{ next }}">
                    <div class="mb-3">
                        <label class="form-label" for="username">Username</label>
                        <input class="form-control" id="username" name="username" autocomplete="username" required autofocus>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" for="password">Password</label>
                        <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
                    </div>
                    <button class="btn btn-primary w-100" type="submit">Sign in</button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
